<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sudoku</title>
<meta name="theme-color" content="#f5f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<style>
:root{
  --bg:#f5f3ee; --surface:#ffffff; --ink:#1c1d21; --muted:#7b7d86; --line:#d9d6ce; --line-strong:#1c1d21;
  --accent:#e2589a; --accent-soft:#fde7f1; --peer:#f4eeee; --same:#f8cbe0;
  --err:#e0402c; --err-soft:#fde4e2; --ok:#1f9d63;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121316; --surface:#1c1d22; --ink:#eceef3; --muted:#8c8f99; --line:#33353d; --line-strong:#9a9daa;
    --accent:#ff8fc0; --accent-soft:#4a2338; --peer:#26232a; --same:#5c2a45;
    --err:#ff6a4d; --err-soft:#4a2224; --ok:#4fd197;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
.app{max-width:500px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:14px;
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 16px)}

header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:26px;font-weight:800;letter-spacing:-.5px;margin:0}
.pill{background:var(--surface);box-shadow:var(--shadow);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px}
.pill:active{transform:scale(.96)}

.info{display:flex;align-items:center;justify-content:space-between;font-size:14px;color:var(--muted);font-weight:600}
.info b{color:var(--ink);font-weight:700}
.info .err b{color:var(--err)}
.timer{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.icon-btn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow)}
.icon-btn svg{width:14px;height:14px}

/* tabuleiro */
.board-wrap{position:relative}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:2px;background:var(--line-strong);border:2px solid var(--line-strong);
  border-radius:12px;overflow:hidden;aspect-ratio:1;width:100%}
.box{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));min-width:0;min-height:0;gap:1px;background:var(--line)}
.cell{background:var(--surface);display:grid;grid-template:100%/100%;place-items:center;min-width:0;min-height:0;overflow:hidden;line-height:1;position:relative;font-size:clamp(20px,6.4vw,30px);
  font-weight:500;color:var(--accent);cursor:pointer;transition:background .12s}
.cell.given{color:var(--ink);font-weight:700}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cell.wrong{color:var(--err);background:var(--err-soft)}
.cell.wrong.sel{box-shadow:inset 0 0 0 2px var(--err)}
.cell.pop{animation:pop .28s ease}
.cell.shake{animation:shake .32s ease}
.cell.flash{animation:flash .6s ease}
@keyframes pop{50%{transform:scale(1.18)}}
@keyframes shake{20%,60%{transform:translateX(-3px)}40%,80%{transform:translateX(3px)}}
@keyframes flash{40%{background:var(--same)}}
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));width:100%;height:100%;padding:2px}
.notes span{display:grid;place-items:center;font-size:clamp(8px,2.4vw,11px);color:var(--muted);font-weight:600;line-height:1}
.notes span.hl{color:var(--accent);font-weight:800}

.paused{position:absolute;inset:0;border-radius:12px;background:var(--surface);display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;box-shadow:inset 0 0 0 2px var(--line-strong)}
.paused.on{display:flex}
.paused p{margin:0;color:var(--muted);font-weight:600}

/* ferramentas */
.tools{margin-top:6px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;position:relative}
.tool .ic{width:46px;height:46px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);transition:.15s}
.tool .ic svg{width:21px;height:21px}
.tool:active .ic{transform:scale(.92)}
.tool.on .ic{background:var(--accent);color:#fff}
.tool.on{color:var(--accent)}
.tool .badge{position:absolute;top:2px;left:calc(50% + 12px);background:var(--accent);color:#fff;font-size:11px;font-weight:700;
  min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.tool .badge.zero{background:var(--muted)}
.tool:disabled{opacity:.4}

/* teclado de números */
.pad{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.num{background:var(--surface);box-shadow:var(--shadow);border-radius:12px;padding:14px 0;display:flex;justify-content:center;transition:.15s}
.num b{font-size:clamp(22px,6.6vw,30px);font-weight:600;color:var(--accent);line-height:1}
.num:active{transform:scale(.92)}
.num.done{visibility:hidden}
.app.notes-mode .num b{color:var(--muted)}

/* modais */
.modal{position:fixed;inset:0;background:rgba(10,10,14,.45);display:none;align-items:flex-end;justify-content:center;z-index:10;
  padding:16px;padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
.modal.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--surface);border-radius:24px;padding:22px 18px 18px;width:100%;max-width:468px;animation:up .25s ease}
@keyframes up{from{transform:translateY(30px)}}
.sheet h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.sheet p.sub{margin:0 0 16px;color:var(--muted);font-size:15px}
.levels{display:flex;flex-direction:column;gap:8px}
.lvl{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:14px;padding:15px 16px;font-weight:600;font-size:17px;text-align:left}
.lvl small{color:var(--muted);font-weight:500;font-size:13px}
.lvl:active{transform:scale(.98)}
.dots{display:flex;gap:4px;margin-top:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--accent)}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:16px;background:var(--accent);color:#fff;margin-top:10px}
.btn.ghost{background:var(--bg);color:var(--ink)}
.btn:active{transform:scale(.98)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px}
.stat{background:var(--bg);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:20px}
.stat small{color:var(--muted);font-size:12px;font-weight:600}
.big{font-size:44px;text-align:center;margin:4px 0 6px}
.center{text-align:center}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Sudoku</h1>
    <button class="pill" id="newBtn">Novo jogo</button>
  </header>

  <div class="info">
    <span id="lvlName">Fácil</span>
    <span class="err">Erros <b id="errs">0</b>/3</span>
    <span class="timer"><b id="time">00:00</b>
      <button class="icon-btn" id="pauseBtn" aria-label="Pausar">
        <svg viewBox="0 0 14 14" fill="currentColor"><rect x="2.5" y="2" width="3" height="10" rx="1"/><rect x="8.5" y="2" width="3" height="10" rx="1"/></svg>
      </button>
    </span>
  </div>

  <div class="board-wrap">
    <div class="board" id="board"></div>
    <div class="paused" id="paused">
      <p>Jogo pausado</p>
      <button class="pill" id="resumeBtn">Continuar</button>
    </div>
  </div>

  <div class="tools">
    <button class="tool" id="undoBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></span>Desfazer</button>
    <button class="tool" id="eraseBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg></span>Apagar</button>
    <button class="tool" id="notesBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></span>Anotações</button>
    <button class="tool" id="hintBtn"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></svg></span>Dica<span class="badge" id="hintCount">3</span></button>
  </div>

  <div class="pad" id="pad"></div>
</div>

<!-- escolher nível -->
<div class="modal" id="menu">
  <div class="sheet">
    <h2>Novo jogo</h2>
    <p class="sub">Escolha o nível</p>
    <div class="levels" id="levels"></div>
    <button class="btn ghost" id="closeMenu">Voltar ao jogo</button>
  </div>
</div>

<!-- 3 erros -->
<div class="modal" id="lose">
  <div class="sheet center">
    <div class="big">:(</div>
    <h2>3 erros</h2>
    <p class="sub">Quer continuar mesmo assim ou começar outro?</p>
    <button class="btn" id="keepBtn">Continuar jogando</button>
    <button class="btn ghost" id="loseNew">Novo jogo</button>
  </div>
</div>

<!-- vitória -->
<div class="modal" id="win">
  <div class="sheet center">
    <div class="big">&#9733;</div>
    <h2>Parabéns!</h2>
    <p class="sub" id="winSub">Você completou o nível Fácil</p>
    <div class="stats">
      <div class="stat"><b id="wTime">0:00</b><small>Tempo</small></div>
      <div class="stat"><b id="wErr">0</b><small>Erros</small></div>
      <div class="stat"><b id="wBest">0:00</b><small>Recorde</small></div>
    </div>
    <button class="btn" id="winNew">Jogar de novo</button>
  </div>
</div>

<script>
const LEVELS = {
  facil:   {name:'Fácil',        clues:40, dots:1},
  medio:   {name:'Médio',        clues:33, dots:2},
  dificil: {name:'Difícil',      clues:28, dots:3},
  expert:  {name:'Especialista', clues:23, dots:4},
};
const MAX_ERR = 3, MAX_HINTS = 3, KEY = 'sudoku-v1';

// ---------- geometria ----------
const ROW = [], COL = [], BOX = [], PEERS = [];
for (let i = 0; i < 81; i++) { ROW[i] = i / 9 | 0; COL[i] = i % 9; BOX[i] = (ROW[i] / 3 | 0) * 3 + (COL[i] / 3 | 0); }
for (let i = 0; i < 81; i++) {
  PEERS[i] = [];
  for (let j = 0; j < 81; j++) if (j !== i && (ROW[j] === ROW[i] || COL[j] === COL[i] || BOX[j] === BOX[i])) PEERS[i].push(j);
}

// ---------- gerador ----------
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pop = m => { let n = 0; while (m) { m &= m - 1; n++; } return n; };

// Resolve g no lugar; retorna quantas soluções achou (para em `limit`).
function search(g, limit, random) {
  const R = new Int16Array(9), C = new Int16Array(9), B = new Int16Array(9);
  for (let i = 0; i < 81; i++) if (g[i]) { const m = 1 << g[i]; R[ROW[i]] |= m; C[COL[i]] |= m; B[BOX[i]] |= m; }
  let count = 0;
  const D = [1,2,3,4,5,6,7,8,9];
  (function rec() {
    let best = -1, bm = 0, bn = 10;
    for (let i = 0; i < 81; i++) {
      if (g[i]) continue;
      const m = ~(R[ROW[i]] | C[COL[i]] | B[BOX[i]]) & 1022, n = pop(m);
      if (n < bn) { bn = n; best = i; bm = m; if (n < 2) break; }
    }
    if (best < 0) return ++count >= limit;
    if (!bn) return false;
    const r = ROW[best], c = COL[best], b = BOX[best];
    for (const v of random ? shuffle(D.slice()) : D) {
      const m = 1 << v; if (!(bm & m)) continue;
      g[best] = v; R[r] |= m; C[c] |= m; B[b] |= m;
      if (rec()) return true;
      g[best] = 0; R[r] ^= m; C[c] ^= m; B[b] ^= m;
    }
    return false;
  })();
  return count;
}

function attempt(target) {
  const sol = new Array(81).fill(0);
  search(sol, 1, true);
  const puz = sol.slice();
  let clues = 81;
  const tryRemove = (cells) => {
    const keep = cells.map(k => puz[k]);
    cells.forEach(k => puz[k] = 0);
    if (search(puz.slice(), 2, false) !== 1) { cells.forEach((k, n) => puz[k] = keep[n]); return; }
    clues -= keep.filter(Boolean).length;
  };
  for (const i of shuffle([...Array(41).keys()])) {   // primeiro em pares simétricos
    if (clues <= target) break;
    if (puz[i]) tryRemove(i === 40 ? [i] : [i, 80 - i]);
  }
  for (const i of shuffle([...Array(81).keys()])) {   // depois casa por casa
    if (clues <= target) break;
    if (puz[i]) tryRemove([i]);
  }
  return { puz, sol, clues };
}

function generate(level) {
  const target = LEVELS[level].clues;
  let best = null;
  for (let k = 0; k < 40; k++) {
    const g = attempt(target);
    if (!best || g.clues < best.clues) best = g;
    if (best.clues <= target) break;
  }
  return best;
}

// ---------- estado ----------
let S = null, sel = -1, notesMode = false, paused = false, hist = [];
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const save = () => store.set(KEY, S);
const best = () => store.get(KEY + '-best') || {};

function newGame(level) {
  const { puz, sol } = generate(level);
  S = { level, puz, sol, val: puz.slice(), notes: new Array(81).fill(0), err: 0, noLimit: false, hints: MAX_HINTS, time: 0, done: false };
  sel = -1; hist = []; notesMode = false; paused = false;
  save(); render();
}

const isLocked = i => S.puz[i] || (S.val[i] && S.val[i] === S.sol[i]);
const isWrong = i => S.val[i] && S.val[i] !== S.sol[i];

function snapshot(i) { hist.push({ i, v: S.val[i], notes: S.notes.slice() }); if (hist.length > 200) hist.shift(); }

function place(n) {
  if (sel < 0 || S.done || paused || isLocked(sel)) return;
  const i = sel;
  if (notesMode) {
    if (S.val[i]) return;
    snapshot(i);
    S.notes[i] ^= 1 << n;
    save(); render(); return;
  }
  if (S.val[i] === n) return;
  snapshot(i);
  S.val[i] = n; S.notes[i] = 0;
  if (n !== S.sol[i]) {
    S.err++;
    anim(i, 'shake');
    if (navigator.vibrate) navigator.vibrate(60);
    save(); render();
    if (S.err >= MAX_ERR && !S.noLimit) setTimeout(() => open('lose'), 350);
    return;
  }
  for (const p of PEERS[i]) S.notes[p] &= ~(1 << n);
  anim(i, 'pop');
  checkGroups(i);
  save(); render();
  if (S.val.every((v, k) => v === S.sol[k])) finish();
}

// pisca linha/coluna/quadrado quando completa
function checkGroups(i) {
  const ok = j => S.val[j] === S.sol[j];
  const groups = [[...Array(81).keys()].filter(j => ROW[j] === ROW[i]),
                  [...Array(81).keys()].filter(j => COL[j] === COL[i]),
                  [...Array(81).keys()].filter(j => BOX[j] === BOX[i])];
  for (const g of groups) if (g.every(ok)) g.forEach((j, k) => setTimeout(() => anim(j, 'flash'), k * 30));
}

function erase() {
  if (sel < 0 || S.done || paused || isLocked(sel)) return;
  if (!S.val[sel] && !S.notes[sel]) return;
  snapshot(sel);
  S.val[sel] = 0; S.notes[sel] = 0;
  save(); render();
}

function undo() {
  if (S.done || paused) return;
  const h = hist.pop(); if (!h) return;
  S.val[h.i] = h.v; S.notes = h.notes; sel = h.i;
  save(); render();
}

function hint() {
  if (S.done || paused || S.hints <= 0) return;
  let i = sel;
  if (i < 0 || isLocked(i)) {
    const empty = [...Array(81).keys()].filter(k => !isLocked(k));
    if (!empty.length) return;
    i = empty[Math.random() * empty.length | 0];
  }
  snapshot(i);
  sel = i; S.hints--;
  S.val[i] = S.sol[i]; S.notes[i] = 0;
  for (const p of PEERS[i]) S.notes[p] &= ~(1 << S.sol[i]);
  anim(i, 'pop'); checkGroups(i);
  save(); render();
  if (S.val.every((v, k) => v === S.sol[k])) finish();
}

function finish() {
  S.done = true; save();
  const b = best(), prev = b[S.level];
  if (!prev || S.time < prev) { b[S.level] = S.time; store.set(KEY + '-best', b); }
  $('winSub').textContent = 'Você completou o nível ' + LEVELS[S.level].name;
  $('wTime').textContent = fmt(S.time);
  $('wErr').textContent = S.err;
  $('wBest').textContent = fmt(best()[S.level]);
  setTimeout(() => open('win'), 700);
}

// ---------- interface ----------
const $ = id => document.getElementById(id);
const fmt = s => { s = s || 0; const h = s / 3600 | 0, m = (s % 3600) / 60 | 0, x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(x).padStart(2, '0'); };
const cells = [];

(function build() {
  const board = $('board');
  for (let b = 0; b < 9; b++) {
    const box = document.createElement('div'); box.className = 'box';
    for (let k = 0; k < 9; k++) {
      const i = ((b / 3 | 0) * 3 + (k / 3 | 0)) * 9 + (b % 3) * 3 + k % 3;
      const c = document.createElement('div'); c.className = 'cell';
      c.addEventListener('pointerdown', () => { if (paused || S.done) return; sel = i; render(); });
      cells[i] = c; box.appendChild(c);
    }
    board.appendChild(box);
  }
  const pad = $('pad');
  for (let n = 1; n <= 9; n++) {
    const b = document.createElement('button'); b.className = 'num'; b.dataset.n = n;
    b.innerHTML = `<b>${n}</b>`;
    b.addEventListener('click', () => place(n));
    pad.appendChild(b);
  }
})();

function anim(i, cls) { const c = cells[i]; c.classList.remove(cls); void c.offsetWidth; c.classList.add(cls); setTimeout(() => c.classList.remove(cls), 650); }

function render() {
  const sv = sel >= 0 && S.val[sel] && !isWrong(sel) ? S.val[sel] : 0;
  for (let i = 0; i < 81; i++) {
    const c = cells[i], v = S.val[i];
    const peer = sel >= 0 && i !== sel && (ROW[i] === ROW[sel] || COL[i] === COL[sel] || BOX[i] === BOX[sel]);
    c.className = 'cell' + (S.puz[i] ? ' given' : '') + (isWrong(i) ? ' wrong' : '') +
      (i === sel ? ' sel' : sv && v === sv && !isWrong(i) ? ' same' : peer ? ' peer' : '');
    if (v) c.textContent = v;
    else if (S.notes[i]) {
      let h = '<div class="notes">';
      for (let n = 1; n <= 9; n++) h += `<span class="${n === sv ? 'hl' : ''}">${S.notes[i] & (1 << n) ? n : ''}</span>`;
      c.innerHTML = h + '</div>';
    } else c.textContent = '';
  }
  // contagem de números restantes
  const cnt = new Array(10).fill(0);
  for (let i = 0; i < 81; i++) if (S.val[i] && S.val[i] === S.sol[i]) cnt[S.val[i]]++;
  for (const b of $('pad').children) {
    const n = +b.dataset.n, left = 9 - cnt[n];
    b.classList.toggle('done', left === 0);
  }
  $('lvlName').textContent = LEVELS[S.level].name;
  $('errs').textContent = S.err;
  $('time').textContent = fmt(S.time);
  $('hintCount').textContent = S.hints;
  $('hintCount').classList.toggle('zero', S.hints === 0);
  $('hintBtn').disabled = S.hints === 0;
  $('notesBtn').classList.toggle('on', notesMode);
  $('app').classList.toggle('notes-mode', notesMode);
  $('paused').classList.toggle('on', paused);
}

function open(id) { $(id).classList.add('on'); }
function close(id) { $(id).classList.remove('on'); }

function openMenu() {
  const b = best();
  $('levels').innerHTML = Object.entries(LEVELS).map(([k, l]) => `
    <button class="lvl" data-l="${k}">
      <span>${l.name}<div class="dots">${[1,2,3,4].map(d => `<i class="${d <= l.dots ? 'f' : ''}"></i>`).join('')}</div></span>
      <small>${b[k] ? 'Recorde ' + fmt(b[k]) : ''}</small>
    </button>`).join('');
  $('closeMenu').style.display = S && !S.done ? '' : 'none';
  open('menu');
}
$('levels').addEventListener('click', e => {
  const b = e.target.closest('.lvl'); if (!b) return;
  close('menu'); setTimeout(() => newGame(b.dataset.l), 30);
});

$('newBtn').onclick = openMenu;
$('closeMenu').onclick = () => close('menu');
$('undoBtn').onclick = undo;
$('eraseBtn').onclick = erase;
$('notesBtn').onclick = () => { notesMode = !notesMode; render(); };
$('hintBtn').onclick = hint;
$('pauseBtn').onclick = () => { if (!S.done) { paused = true; render(); } };
$('resumeBtn').onclick = () => { paused = false; render(); };
$('keepBtn').onclick = () => { S.noLimit = true; save(); close('lose'); };
$('loseNew').onclick = () => { close('lose'); openMenu(); };
$('winNew').onclick = () => { close('win'); openMenu(); };

document.addEventListener('keydown', e => {
  if (!S || document.querySelector('.modal.on')) return;
  if (e.key >= '1' && e.key <= '9') place(+e.key);
  else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') erase();
  else if (e.key === 'n' || e.key === 'N') { notesMode = !notesMode; render(); }
  else if ((e.metaKey || e.ctrlKey) && e.key === 'z') undo();
  else if (e.key.startsWith('Arrow')) {
    if (sel < 0) sel = 40;
    else {
      const r = ROW[sel], c = COL[sel];
      if (e.key === 'ArrowUp') sel = ((r + 8) % 9) * 9 + c;
      if (e.key === 'ArrowDown') sel = ((r + 1) % 9) * 9 + c;
      if (e.key === 'ArrowLeft') sel = r * 9 + (c + 8) % 9;
      if (e.key === 'ArrowRight') sel = r * 9 + (c + 1) % 9;
    }
    e.preventDefault(); render();
  }
});

// cronômetro: só conta com o app aberto e sem pausa
setInterval(() => {
  if (!S || S.done || paused || document.hidden || document.querySelector('.modal.on')) return;
  S.time++; $('time').textContent = fmt(S.time);
  if (S.time % 5 === 0) save();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden && S) save(); });

// ---------- início ----------
S = store.get(KEY);
if (S && S.puz && S.puz.length === 81) { render(); if (S.done) openMenu(); }
else { newGame('facil'); openMenu(); }

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
